[package]
name = "lc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "labcraft"
path = "src/main.rs"

[dependencies]
lc-model = { path = "../lc-model" }
lc-nodes = { path = "../lc-nodes" }
lc-runtime = { path = "../lc-runtime" }
lc-layout = { path = "../lc-layout" }
lc-dsl = { path = "../lc-dsl" }
lc-theme = { path = "../lc-theme" }
lc-mcp = { path = "../lc-mcp" }
lc-render = { path = "../lc-render" }
lc-editor = { path = "../lc-editor", optional = true }
serde.workspace = true
serde_json.workspace = true

[features]
default = ["gui"]
gui = ["dep:lc-editor"]
